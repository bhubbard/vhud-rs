[package]
name = "vhud-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "Pure Rust GTA V radar, minimap projection, blip clamping, GPS route, and HUD ring meter engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/vhud-rs"
homepage = "https://bhubbard.github.io/vhud-rs"
readme = "README.md"
keywords = ["gta", "minimap", "radar", "hud", "game-dev"]
categories = ["game-development", "mathematics", "rendering"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
